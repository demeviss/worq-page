<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WorQ Group</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS -->
<link rel="stylesheet" href="css/client-login.css">

</head>

<body>

<section class="client-login">

  <div class="login-wrapper">

    <div class="login-header">
      <a href="index.html" class="login-close" aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
</a>
      <i class="fa-regular fa-user"></i>
      
      <h1>Client Login</h1>
      <div class="login-line"></div>
      <p>
        This area is reserved for Worq clients.<br>
        Please enter your credentials to access your project dashboard.
      </p>
      
    </div>

    <form class="login-form">
      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="you@company.com" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" required>
      </div>

      <button type="submit">Access Portal</button>
      <a href="#" class="request-access">Request access →</a>
    </form>

  </div>

</section>

</body>
</html>
